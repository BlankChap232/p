name: Build Panda Tv Elite 1.9.2 channel surfing title QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pandatv-elite-192-surf-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'BlankChap232/p'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain verified, working 1.9.1 test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download v1.9.1-elite-navigation-qa.1 --repo "$GITHUB_REPOSITORY" --pattern PandaTV-TEST.apk --dir source
          echo 'fade6a85c3398e14fc2766b38815fd443825dae4c66e3e8045714aeb6dc03da8  source/PandaTV-TEST.apk' | sha256sum -c -
      - name: Download fixed-version official smali tooling
        run: |
          set -euo pipefail
          mkdir -p tools
          BASE='https://github.com/baksmali/smali/releases/download/3.0.10'
          curl --fail --location --retry 3 "$BASE/baksmali-3.0.10-fat-release.jar" -o tools/baksmali.jar
          curl --fail --location --retry 3 "$BASE/smali-3.0.10-fat-release.jar" -o tools/smali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  tools/baksmali.jar' | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  tools/smali.jar' | sha256sum -c -
      - name: Apply only title refresh and EPG lookup updates
        run: |
          set -euo pipefail
          mkdir -p working
          python3 - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          b64=Path('release-patches/elite192-surf-patcher.py.zlib.b64').read_text().strip()
          raw=zlib.decompress(base64.b64decode(b64,validate=True))
          actual=hashlib.sha256(raw).hexdigest()
          expected='70079a53e2d7ade6b6bfe97059e4e7d5f4f86487cc262662855eb2bbd6940fc8'
          assert actual==expected,actual
          Path('working/patch_surf_titles.py').write_bytes(raw)
          from zipfile import ZipFile
          with ZipFile('source/PandaTV-TEST.apk') as z:
              assert z.testzip() is None
              for name in ('classes4.dex','assets/panda_program_details_v172.js','assets/pandatv_v2943_native_catalog.js'):
                  dest=Path('working')/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(name))
          PY
          # Normalize the supported .locals and .registers declaration styles
          # in the callback without touching decoder or stream handling.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('working/patch_surf_titles.py')
          s=p.read_text()
          s=s.replace("r'(?m)^(\\s*\\.locals\\s+)(\\d+)(\\s*)$'",
                      "r'(?m)^(\\s*\\.(?:locals|registers)\\s+)(\\d+)(\\s*)$'")
          s=s.replace("    if count < 3:", "    if count < (6 if '.registers' in local.group(1) else 3):")
          s=s.replace(" + '3' + body[local.end(2):]",
                      " + str(6 if '.registers' in local.group(1) else 3) + body[local.end(2):]")
          p.write_text(s)
          PY
          java -jar tools/baksmali.jar disassemble working/classes4.dex -o working/smali
          python3 working/patch_surf_titles.py \
            working/smali/com/pandatv/iptv/NativePlayerActivity.smali \
            working/assets/panda_program_details_v172.js \
            working/assets/pandatv_v2943_native_catalog.js
          node --check working/assets/panda_program_details_v172.js
          node --check working/assets/pandatv_v2943_native_catalog.js
          grep -Fq 'requestCurrentProgramInfo()V' working/smali/com/pandatv/iptv/NativePlayerActivity.smali
          grep -Fq 'pandaDisplayTitle' working/smali/com/pandatv/iptv/NativePlayerActivity.smali
          java -jar tools/smali.jar assemble working/smali -o working/classes4.dex
      - name: Repack single DEX and two guide JS assets, preserve all native libraries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile,ZipInfo
          from pathlib import Path
          import hashlib
          patches={
            'classes4.dex':'working/classes4.dex',
            'assets/panda_program_details_v172.js':'working/assets/panda_program_details_v172.js',
            'assets/pandatv_v2943_native_catalog.js':'working/assets/pandatv_v2943_native_catalog.js'}
          # Only new QA app label/package identity: the previous 1.9.1 build has
          # a one-off signing key and must not be overwritten.
          with ZipFile('source/PandaTV-TEST.apk') as src, ZipFile('working/unsigned.apk','w') as out:
            for info in src.infolist():
              name=info.filename
              if name.startswith('META-INF/') and name.endswith(('.RSA','.SF','.DSA')):continue
              content=Path(patches[name]).read_bytes() if name in patches else src.read(name)
              if name=='AndroidManifest.xml':
                original='com.pandatv.elitev301.elite191'.encode('utf-16le')
                new='com.pandatv.elitev301.elite192'.encode('utf-16le')
                assert len(original)==len(new)
                assert content.count(original)>=1
                content=content.replace(original,new)
              zi=ZipInfo(name,info.date_time)
              zi.compress_type=info.compress_type
              zi.external_attr=info.external_attr
              zi.internal_attr=info.internal_attr
              zi.create_system=info.create_system
              zi.comment=info.comment
              out.writestr(zi,content,compress_type=zi.compress_type,compresslevel=6)
          with ZipFile('source/PandaTV-TEST.apk') as a,ZipFile('working/unsigned.apk') as b:
            assert b.testzip() is None
            native=[n for n in a.namelist() if n.endswith('.so')]
            dex=[n for n in a.namelist() if n.endswith('.dex')]
            assert len(native)==10,native
            assert len(dex)==5,dex
            for n in native+[n for n in dex if n!='classes4.dex']:
              assert hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(),n
          print('All 10 native libraries and 4 unaffected DEX files remain byte-identical.')
          PY
      - name: Sign separately installable QA build and audit Android identity
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 working/unsigned.apk working/aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -alias pandaqa -keyalg RSA -keysize 3072 -validity 365 \
            -keystore "$RUNNER_TEMP/panda-elite-192-qa.jks" -storepass "$PASS" -keypass "$PASS" \
            -dname 'CN=Panda Tv Elite Surf QA Test' >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/panda-elite-192-qa.jks" --ks-key-alias pandaqa \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out PandaTV-TEST.apk working/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs PandaTV-TEST.apk > apk-signature.txt
          "$BT/zipalign" -c -v 4 PandaTV-TEST.apk > apk-alignment.txt
          "$BT/aapt" dump badging PandaTV-TEST.apk > apk-badging.txt
          grep -q "^package: name='com.pandatv.elitev301.elite192'" apk-badging.txt
          grep -q "^application-label:'Panda Tv Elite'" apk-badging.txt
          sha256sum PandaTV-TEST.apk > apk-sha256.txt
      - name: Publish QA prerelease only, keeping approved public installer unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.9.2-elite-channel-surf-title-qa.1
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # Panda Tv Elite 1.9.2 — Channel Surf Title QA
          **Test build only**, signed separately with package identity `com.pandatv.elitev301.elite192`.
          Existing approved Elite public installer is unchanged.
          This build patches the channel-change metadata refresh and current-program label only:
          - Channel +/− and left/right request channel and EPG information after tune.
          - The native top title updates to the real channel name and number, with the current program if EPG provides it.
          - The displayed program is refreshed for the new URL; no stale prior-channel details.
          - All ten FFmpeg/Media3 native libraries and four of the five DEX files are unchanged.
          - No changes to stream selection, buffering or controls.
          Real-device channel surfing still needs confirmation.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" PandaTV-TEST.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title 'Panda Tv Elite 1.9.2 — Channel Surf Titles QA' --notes-file release-notes.md
          else
            gh release create "$TAG" PandaTV-TEST.apk --repo "$GITHUB_REPOSITORY" --target main --prerelease \
              --title 'Panda Tv Elite 1.9.2 — Channel Surf Titles QA' --notes-file release-notes.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PandaTv-Elite-192-title-audit
          path: |
            apk-signature.txt
            apk-badging.txt
            apk-alignment.txt
            apk-sha256.txt
          retention-days: 7
          if-no-files-found: ignore
