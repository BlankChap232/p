name: Build Panda Tv Elite 2.0 reliability QA installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pandatv-elite-200-reliability-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'BlankChap232/p'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact approved player and verified EPG 2.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline source work tools
          gh release download v1.9.3-elite-visible-tabs-public.1 --repo "$GITHUB_REPOSITORY" --pattern PandaTV.apk --dir baseline
          echo 'e535444670aa495cdeb49f69c6ea6ebcb699aeb59e7b37327f7d5a7ac741729e  baseline/PandaTV.apk' | sha256sum -c -
          gh release download v2.0.0-epg-reliability-source.1 --repo "$GITHUB_REPOSITORY" --pattern '*.tar.br' --dir source
          echo 'bd16d4b468e6f6974ddceffe3140d4f211529c33392747374c3d37f86f93598b  source/PandaTvElite_2.0_Engineering_Core.tar.br' | sha256sum -c -
      - name: Extract approved patches and validate guide changes
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check brotli
          python3 - <<'PY'
          import hashlib, brotli, tarfile, io
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('source/PandaTvElite_2.0_Engineering_Core.tar.br')
          raw=brotli.decompress(p.read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='2c26c916dd0367d41f5c4a5aeac5e3d4ac9d12a7b30f2526802c786d3b5d0e6c'
          with tarfile.open(fileobj=io.BytesIO(raw)) as t:
            expected={'assets/panda_epg_genie_v200.js','guide.patch','patch_native_resume.py'}
            assert set(t.getnames())==expected
            for x in t.getmembers():
              if not x.isfile():raise RuntimeError('Unexpected source package member')
              out=Path('source')/x.name
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(t.extractfile(x).read())
          with ZipFile('baseline/PandaTV.apk') as z:
            assert z.testzip() is None
            for n in ('AndroidManifest.xml','classes4.dex','assets/pandatv.html','assets/pandatv_v2959_grid.js'):
              dst=Path('work')/n
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(z.read(n))
            assert len([x for x in z.namelist() if x.endswith('.so')])==10
            assert len([x for x in z.namelist() if x.endswith('.dex')])==5
          PY
          patch --batch -p1 --directory=work -i "$PWD/source/guide.patch"
          node --check work/assets/pandatv_v2959_grid.js
          node --check source/assets/panda_epg_genie_v200.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/assets/pandatv.html')
          html=p.read_text(encoding='utf-8')
          assert '</body>' in html and 'panda_epg_genie_v200.js' not in html
          html=html.replace('</body>','<script src="panda_epg_genie_v200.js"></script>\n</body>')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Compile guarded video surface resume patch
        run: |
          set -euo pipefail
          BASE='https://github.com/baksmali/smali/releases/download/3.0.10'
          curl -fsSL --retry 3 "$BASE/baksmali-3.0.10-fat-release.jar" -o tools/baksmali.jar
          curl -fsSL --retry 3 "$BASE/smali-3.0.10-fat-release.jar" -o tools/smali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  tools/baksmali.jar' | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  tools/smali.jar' | sha256sum -c -
          java -jar tools/baksmali.jar disassemble work/classes4.dex -o work/smali
          python3 source/patch_native_resume.py work/smali/com/pandatv/iptv/NativePlayerActivity.smali
          java -jar tools/smali.jar assemble work/smali -o work/classes4-patched.dex
          test -s work/classes4-patched.dex
      - name: Repackage verified 1.9.3 app using only narrow QA changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          src=Path('baseline/PandaTV.apk')
          old='com.pandatv.elitev301.elite193'.encode('utf-16le')
          new='com.pandatv.elitev301.elite200'.encode('utf-16le')
          assert len(old)==len(new)
          modifications={
            'classes4.dex':Path('work/classes4-patched.dex').read_bytes(),
            'assets/pandatv.html':Path('work/assets/pandatv.html').read_bytes(),
            'assets/pandatv_v2959_grid.js':Path('work/assets/pandatv_v2959_grid.js').read_bytes(),
            'assets/panda_epg_genie_v200.js':Path('source/assets/panda_epg_genie_v200.js').read_bytes()}
          with zipfile.ZipFile(src) as original,zipfile.ZipFile('work/unsigned.apk','w') as dst:
            for info in original.infolist():
              n=info.filename
              if n=='META-INF/MANIFEST.MF' or (n.startswith('META-INF/') and n.endswith(('.SF','.RSA','.DSA'))):continue
              data=modifications.pop(n,original.read(n))
              if n=='AndroidManifest.xml':
                assert data.count(old)>0
                data=data.replace(old,new)
              zi=zipfile.ZipInfo(n,info.date_time)
              zi.compress_type=info.compress_type
              zi.external_attr=info.external_attr
              zi.internal_attr=info.internal_attr
              zi.create_system=info.create_system
              zi.comment=info.comment
              dst.writestr(zi,data,compress_type=zi.compress_type,compresslevel=6)
            for n,data in modifications.items():
              dst.writestr(n,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          with zipfile.ZipFile(src) as oldzip,zipfile.ZipFile('work/unsigned.apk') as newzip:
            assert newzip.testzip() is None
            libs=[n for n in oldzip.namelist() if n.endswith('.so')]
            dex=[n for n in oldzip.namelist() if n.endswith('.dex')]
            assert len(libs)==10 and len(dex)==5
            for n in libs+[n for n in dex if n!='classes4.dex']:
              assert hashlib.sha256(oldzip.read(n)).digest()==hashlib.sha256(newzip.read(n)).digest(),n
            assert 'assets/panda_epg_genie_v200.js' in newzip.namelist()
            assert new in newzip.read('AndroidManifest.xml')
          print('All ten native decoder libraries and four untouched DEX files match 1.9.3 exactly.')
          PY
      - name: Sign separate QA build and verify Android installer
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 work/unsigned.apk work/aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -alias pandaqa -keyalg RSA -keysize 3072 -validity 365 \
            -keystore "$RUNNER_TEMP/pandatv20-qa.jks" -storepass "$PASS" -keypass "$PASS" \
            -dname 'CN=Panda Tv Elite 2.0 Engineering QA' >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/pandatv20-qa.jks" --ks-key-alias pandaqa \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out PandaTvElite-2.0-TEST.apk work/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs PandaTvElite-2.0-TEST.apk | tee signature.txt
          "$BT/zipalign" -c -v 4 PandaTvElite-2.0-TEST.apk > alignment.txt
          "$BT/aapt" dump badging PandaTvElite-2.0-TEST.apk | tee badging.txt | head -n 16
          grep -q "^package: name='com.pandatv.elitev301.elite200'" badging.txt
          grep -q "^application-label:'Panda Tv Elite'" badging.txt
          sha256sum PandaTvElite-2.0-TEST.apk > apk-sha256.txt
      - name: Publish QA test installer, not the official public download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.0.0-elite-epg-resume-qa.1
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          # Panda Tv Elite 2.0 — EPG Genie and Background Resume QA APK
          
          **TEST APP — not a verified production update.** Installs separately from the working public Panda Tv Elite 1.9.3.
          
          Built from the owner-approved 1.9.3 APK, with the 2.0 EPG database/importer, virtualized guide row update, and experimental guarded video surface reattachment when resuming from background. All 10 original native FFmpeg/Media3 libraries and four unchanged DEX files have identical checksums to the approved build.
          
          Actual provider-scale guide loading, streaming, channel surfing, and repeated Android background/resume cases must be tested before replacing the public app. EPG coverage still depends on the listings supplied by the configured feed.
          
          The separate QA package is `com.pandatv.elitev301.elite200`; its test signing key is not permanent and cannot update 1.9.3 in-place. Keep 1.9.3 installed while testing.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" PandaTvElite-2.0-TEST.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title 'Panda Tv Elite 2.0 — Reliability QA Installer' --notes-file notes.md
          else
            gh release create "$TAG" PandaTvElite-2.0-TEST.apk --repo "$GITHUB_REPOSITORY" --target main --prerelease --title 'Panda Tv Elite 2.0 — Reliability QA Installer' --notes-file notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PandaTvElite20-APK-QA-Audit
          path: |
            signature.txt
            alignment.txt
            badging.txt
            apk-sha256.txt
          retention-days: 7
          if-no-files-found: ignore
