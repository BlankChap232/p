name: Publish owner-approved Panda Tv Elite 2.0.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pandatv-elite-201-owner-approved.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'BlankChap232/p'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact owner-approved 2.0.1 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p approved
          gh release download v2.0.1-elite-channel-show-label-qa.1 --repo "$GITHUB_REPOSITORY" --pattern 'PandaTvElite-2.0.1-SURF-TEST.apk' --dir approved
          echo 'ea49aeadc7999ff9de37b1042f79e4f748dda9eef22c2266aabfefcf9f875f38  approved/PandaTvElite-2.0.1-SURF-TEST.apk' | sha256sum -c -
          cp approved/PandaTvElite-2.0.1-SURF-TEST.apk PandaTV.apk
          echo 'ea49aeadc7999ff9de37b1042f79e4f748dda9eef22c2266aabfefcf9f875f38  PandaTV.apk' | sha256sum -c -
          test "$(stat -c%s PandaTV.apk)" = "25475660"
      - name: Verify launcher name, signature, APK identity and integrity
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose --print-certs PandaTV.apk | tee apk-signature.txt
          "$BT/zipalign" -c -v 4 PandaTV.apk > apk-alignment.txt
          "$BT/aapt" dump badging PandaTV.apk | tee apk-badging.txt | head -n 18
          grep -q "^package: name='com.pandatv.elitev301.elite201'" apk-badging.txt
          grep -q "^application-label:'Panda Tv Elite'" apk-badging.txt
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          b=Path('PandaTV.apk').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='ea49aeadc7999ff9de37b1042f79e4f748dda9eef22c2266aabfefcf9f875f38'
          with zipfile.ZipFile('PandaTV.apk') as z:
              assert z.testzip() is None
              dex=[n for n in z.namelist() if n.endswith('.dex')]
              libs=[n for n in z.namelist() if n.endswith('.so')]
              assert len(dex)==5,dex
              assert len(libs)==10,libs
              assert 'assets/pandatv_elite_v191_polish.css' in z.namelist()
              assert 'assets/panda_epg_genie_v200.js' in z.namelist()
              guide=z.read('assets/pandatv_v2943_native_catalog.js')
              assert b'surfLabels' in guide
              assert b'metadataFor' in guide
          print('Exact approved 1.9.3 APK: five DEX, ten native decoders, channel-title fix')
          PY
      - name: Make the exact approved installer the public latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.0.1-elite-channel-labels-public.1
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # Panda Tv Elite 2.0.1 — Owner-Approved Public Download

          This is the **exact APK the owner tested and confirmed working perfectly**, promoted byte-for-byte from the validated 2.0.1 QA release. The APK was not rebuilt, re-signed, or modified for publication.

          Owner-confirmed working 2.0.1 features:
          - EPG Genie 2.0 persistent guide imports, guide performance improvements and background updates.
          - Native Media3/FFmpeg playback and guarded background-resume behavior.
          - Correct channel names and available current EPG show titles while surfing.
          - Readable selected-tab names, Home/Live/Movies/Series navigation improvements.
          - No floating preview player.
          - The native channel-update regression from withdrawn 1.9.2 is not present.
          
          **Important installation/update note:** Android application ID is `com.pandatv.elitev301.elite201`. This approved build uses the distinct QA signing certificate and installs separately from previous Panda Tv Elite versions, not as an automatic in-place update. Keep any previous working installation until this one is confirmed. Future in-place updates require the same package identity and signing key. Google Play Protect warnings must be investigated, not bypassed.

          File: `PandaTV.apk` · 25,475,660 bytes · SHA-256: `ea49aeadc7999ff9de37b1042f79e4f748dda9eef22c2266aabfefcf9f875f38`.

          This release does not include source files, playlists, provider credentials, or private signing keys.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" PandaTV.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Panda Tv Elite 2.0.1 — Owner Approved' --notes-file release-notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" PandaTV.apk --repo "$GITHUB_REPOSITORY" --target main --latest --title 'Panda Tv Elite 2.0.1 — Owner Approved' --notes-file release-notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PandaTv-Elite-201-Publication-Audit
          path: |
            apk-signature.txt
            apk-badging.txt
            apk-alignment.txt
          retention-days: 14
          if-no-files-found: ignore
