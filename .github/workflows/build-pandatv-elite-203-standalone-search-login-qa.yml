name: Build Panda Tv Elite 2.0.3 standalone search and simple provider login QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pandatv-elite-203-standalone-search-login-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'BlankChap232/p'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch unchanged approved 2.0.1 player
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base
          gh release download v2.0.1-elite-channel-labels-public.1 --repo "$GITHUB_REPOSITORY" --pattern PandaTV.apk --dir base
          echo 'ea49aeadc7999ff9de37b1042f79e4f748dda9eef22c2266aabfefcf9f875f38  base/PandaTV.apk' | sha256sum -c -
      - name: Syntax and standalone keyword EPG unit tests
        run: |
          set -euo pipefail
          node --check android/standalone203/panda_guide_search_v203.js
          node --check android/standalone203/panda_compact_login_v203.js
          node android/standalone203/test_standalone203.cjs
          python3 - <<'PY'
          from pathlib import Path
          for n in ('panda_guide_search_v203.js','panda_compact_login_v203.js'):
              code=Path('android/standalone203',n).read_text()
              for word in ('supabase','panda_owners','panda_authorize_device','service_role','app_metadata'):
                  assert word not in code.lower(), f'Standalone app unexpectedly depends on backend: {word}'
          print('No owner dashboard API, permissions, or cloud login in the standalone app')
          PY
      - name: Preserve native Media3 and inject guide search and credential recovery only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          from hashlib import sha256
          source=Path('base/PandaTV.apk')
          output=Path('PandaTvElite-2.0.3-unsigned.apk')
          with ZipFile(source) as src:
            assert src.testzip() is None
            items={n:src.read(n) for n in src.namelist()}
            html=items['assets/pandatv.html'].decode('utf-8')
            marker='<script src="panda_epg_genie_v200.js"></script>'
            assert html.count(marker)==1,'EPG Genie anchor missing'
            insert=''.join([
              '<link rel="stylesheet" href="panda_standalone_v203.css">',
              '<script src="panda_guide_search_v203.js"></script>',
              '<script src="panda_compact_login_v203.js"></script>'
            ])
            html=html.replace(marker,marker+insert,1)
            items['assets/pandatv.html']=html.encode('utf-8')
            grid=items['assets/pandatv_v2959_grid.js'].decode('utf-8')
            edits=[
              ("if(p2?.regionFilter && p2.regionFilter!=='all' && region!==p2.regionFilter)return false;",
               "if(!q && p2?.regionFilter && p2.regionFilter!=='all' && region!==p2.regionFilter)return false;"),
              ("if (category !== 'all' && String(ch.group || 'Live TV') !== category) return false;",
               "if (!q && category !== 'all' && String(ch.group || 'Live TV') !== category) return false;"),
              ("if (favorite && !state.favorites.has('live:' + ch.id)) return false;",
               "if (!q && favorite && !state.favorites.has('live:' + ch.id)) return false;"),
              ("if(!matchesNumber && !norm([ch.name,ch.group,ch.epg].join(' ')).includes(q))return false;",
               "if(!matchesNumber && !norm([ch.name,ch.group,ch.epg].join(' ')).includes(q) && !window.PandaGuideSearch203?.matches?.(ch,q))return false;"),
              ('placeholder="Find channel name or #"',
               'placeholder="Search channel or show (e.g. Ravens)"'),
              ('<span class="p2959ScreenReader">Search channels</span>',
               '<span class="p2959ScreenReader">Search channel names and TV guide program titles or descriptions</span>')
            ]
            for old,new in edits:
              assert grid.count(old)==1,'Grid filter patch anchor missing '+old[:60]
              grid=grid.replace(old,new,1)
            count_anchor="count.textContent=n.toLocaleString()+' channel'+(n===1?'':'s')+' · '+SLOTS/2+'-hour schedule';"
            assert grid.count(count_anchor)==1,'Guide count status anchor missing'
            grid=grid.replace(count_anchor,"count.textContent=n.toLocaleString()+' channel'+(n===1?'':'s')+' · '+SLOTS/2+'-hour schedule'+(q202()?' · '+q202():'');",1)
            # Keep the count label informative while reusing the unchanged
            # virtualization, remote navigation, tune and EPG schedule engines.
            mount_anchor='  function mount(reset=false) {'
            assert grid.count(mount_anchor)==1
            grid=grid.replace(mount_anchor,"  const q202=()=>window.PandaGuideSearch203?.status?.()||'';\n"+mount_anchor,1)
            items['assets/pandatv_v2959_grid.js']=grid.encode('utf-8')
            gate=items['assets/pandatv_v291_stability.js'].decode('utf-8')
            gate_anchor="g.querySelector('#p291Error').textContent=P.lastError}"
            assert gate.count(gate_anchor)==1,'Invalid-login overlay anchor missing'
            auto_recover="""g.querySelector('#p291Error').textContent=P.lastError;
           // Panda 2.0.3: on provider authentication failures, show the real three-field
           // login editor automatically AFTER sync flags clear, including for HTTP 401/403.
           const denied=/^(AUTH_DENIED|HTTP_401|HTTP_403)$/.test(String(err?.code||''));
           const firstSetupFailure=!P.stage && !(state.live?.length||state.movies?.length||state.series?.length);
           if(denied||firstSetupFailure){
             let attempts=0;
             const recover=()=>{
               if(!P.gate||attempts++>35)return;
               if(P.syncing||state.syncing){setTimeout(recover,100);return;}
               if(!g.classList.contains('loginEditing'))window.pandaV291EditLogin();
               loginFeedback('Connection needs attention. Review your server, username and password. '+P.lastError,true);
             };
             setTimeout(recover,120);
           }
          }"""
            gate=gate.replace(gate_anchor,auto_recover,1)
            # Remove Android keyboard autocapitalization/autocorrection from
            # account entry fields while preserving existing secret handling.
            old='id="p291Server" type="url"'
            assert gate.count(old)==1
            gate=gate.replace(old,'id="p291Server" type="url" inputmode="url" autocapitalize="off" autocorrect="off"',1)
            old='id="p291Username" autocomplete="username"'
            assert gate.count(old)==1
            gate=gate.replace(old,'id="p291Username" autocomplete="username" autocapitalize="none" autocorrect="off"',1)
            items['assets/pandatv_v291_stability.js']=gate.encode('utf-8')
            for name in ('panda_guide_search_v203.js','panda_compact_login_v203.js','panda_standalone_v203.css'):
              items['assets/'+name]=Path('android/standalone203',name).read_bytes()
            # A different QA install identity protects the owner-approved app.
            old='com.pandatv.elitev301.elite201'.encode('utf-16le')
            new='com.pandatv.elitev301.elite203'.encode('utf-16le')
            assert len(old)==len(new)
            manifest=items['AndroidManifest.xml']
            assert manifest.count(old)>=1,'Unexpected Android package ID'
            items['AndroidManifest.xml']=manifest.replace(old,new)
            original=set(src.namelist())
            with ZipFile(output,'w') as out:
              for info in src.infolist():
                name=info.filename
                if name=='META-INF/MANIFEST.MF' or name.startswith('META-INF/') and name.endswith(('.SF','.RSA','.DSA')):
                  continue
                zi=ZipInfo(name,info.date_time)
                zi.compress_type=info.compress_type
                zi.external_attr=info.external_attr
                zi.internal_attr=info.internal_attr
                zi.create_system=info.create_system
                zi.comment=info.comment
                out.writestr(zi,items[name],compress_type=zi.compress_type,compresslevel=6)
              for name in sorted(set(items)-original):
                out.writestr(name,items[name],compress_type=ZIP_DEFLATED,compresslevel=6)
          with ZipFile(source) as src,ZipFile(output) as out:
            assert out.testzip() is None
            changed={'AndroidManifest.xml','assets/pandatv.html','assets/pandatv_v2959_grid.js','assets/pandatv_v291_stability.js'}
            dex=[n for n in src.namelist() if n.endswith('.dex')]
            libs=[n for n in src.namelist() if n.endswith('.so')]
            assert len(dex)==5,(len(dex),dex)
            assert len(libs)==10,(len(libs),libs)
            for n in dex+libs:
              assert sha256(src.read(n)).digest()==sha256(out.read(n)).digest(),n
            for n in src.namelist():
              if n in changed or n.startswith('META-INF/'):continue
              assert src.read(n)==out.read(n),'Unplanned file modification '+n
            assert b'PandaGuideSearch203' in out.read('assets/pandatv_v2959_grid.js')
            assert b'Edit Login' in out.read('assets/panda_compact_login_v203.js')
            assert b'Connection needs attention' in out.read('assets/pandatv_v291_stability.js')
            assert b'panda201' in out.read('classes4.dex'), 'Native surf-title fix must stay'
          print('QA PASS: exact Media3 native engine, all five DEX, ten FFmpeg libraries, player EPG assets preserved')
          PY
          # Check patched JS syntax from unsigned APK, not only repository files.
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('PandaTvElite-2.0.3-unsigned.apk') as z:
            for n in ['pandatv_v2959_grid.js','pandatv_v291_stability.js']:
              open(n,'wb').write(z.read('assets/'+n))
          PY
          node --check pandatv_v2959_grid.js
          node --check pandatv_v291_stability.js
      - name: Align and sign standalone QA Android package
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 PandaTvElite-2.0.3-unsigned.apk PandaTvElite-2.0.3-aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -alias pandaqa -keyalg RSA -keysize 3072 -validity 365 \
            -keystore "$RUNNER_TEMP/panda203.jks" -storepass "$PASS" -keypass "$PASS" \
            -dname 'CN=Panda Tv Elite Standalone Keyword Search QA 2.0.3' >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/panda203.jks" --ks-key-alias pandaqa \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out PandaTvElite-2.0.3-STANDALONE-SEARCH-TEST.apk PandaTvElite-2.0.3-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs PandaTvElite-2.0.3-STANDALONE-SEARCH-TEST.apk | tee signature.txt
          "$BT/zipalign" -c -v 4 PandaTvElite-2.0.3-STANDALONE-SEARCH-TEST.apk > alignment.txt
          "$BT/aapt" dump badging PandaTvElite-2.0.3-STANDALONE-SEARCH-TEST.apk | tee badging.txt | head -n 16
          grep -q "^package: name='com.pandatv.elitev301.elite203'" badging.txt
          grep -q "^application-label:'Panda Tv Elite'" badging.txt
          sha256sum PandaTvElite-2.0.3-STANDALONE-SEARCH-TEST.apk | tee checksum.txt
      - name: Publish user-testable QA without replacing working public 2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.0.3-elite-standalone-search-login-qa.1
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          # Panda Tv Elite 2.0.3 — Standalone Channel/EPG Search + Compact Login QA
          
          **Install-and-test release.** The owner-approved public 2.0.1 APK remains the official latest until the new build passes testing on a real Android TV.
          
          Changes:
          - Search Live Guide by channel name, category, EPG program title and description across the next 12 hours. Try "ravens". Works from the existing provider/EPG database on the device; no remote search server.
          - Search shows only matching channels even if an old country/category/favorite filter was active.
          - Fast three-field Xtream provider setup (server URL, username and password) and optional direct M3U.
          - Always-available Edit Login shortcut; failed credentials and first-run connection errors automatically reopen the editor.
          - Compact error overlay, reachable sticky buttons, no keyboard auto-capitalization of server/username, password show/hide.
          - No owner-console account, VIP check, Supabase permission or cloud subscription verification.
          - All 5 DEX files and 10 native decoder libraries byte-for-byte preserved, including the 2.0.1 channel-show label fix and EPG Genie 2.0.
          
          **Side-by-side install only:** This APK has Android package ID \`com.pandatv.elitev301.elite203\` and a separate QA certificate. Android will treat it as a new installation and existing IPTV credentials must be entered once. Keep your working 2.0.1 build installed until you verify this on your device.
          
          The search uses available provider and cached EPG listings; if a feed does not list a Ravens game, it cannot invent one. Actual device usability and provider authentication were not verified by GitHub build checks.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" PandaTvElite-2.0.3-STANDALONE-SEARCH-TEST.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Panda Tv Elite 2.0.3 — Standalone Search & Login QA' --prerelease --notes-file notes.md
          else
            gh release create "$TAG" PandaTvElite-2.0.3-STANDALONE-SEARCH-TEST.apk --repo "$GITHUB_REPOSITORY" --target main --prerelease --title 'Panda Tv Elite 2.0.3 — Standalone Search & Login QA' --notes-file notes.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PandaTvElite203-Search-Login-QA
          path: |
            signature.txt
            alignment.txt
            badging.txt
            checksum.txt
          retention-days: 7
          if-no-files-found: ignore
