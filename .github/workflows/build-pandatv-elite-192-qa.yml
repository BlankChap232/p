name: Build Panda Tv Elite 1.9.2 channel-surf QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-pandatv-elite-192-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download working owner-tested 1.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base
          gh release download v1.9.1-elite-navigation-qa.1 --pattern PandaTV-TEST.apk --repo "$GITHUB_REPOSITORY" --dir base
          echo 'fade6a85c3398e14fc2766b38815fd443825dae4c66e3e8045714aeb6dc03da8  base/PandaTV-TEST.apk' | sha256sum -c -
      - name: Disassemble only native player bytecode and apply metadata patch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq smali >/dev/null
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib,zipfile
          b=base64.b64decode(pathlib.Path('release-patches/elite192-surf-patcher.py.zlib.b64').read_text().strip(),validate=True)
          script=zlib.decompress(b)
          assert hashlib.sha256(script).hexdigest()=='70079a53e2d7ade6b6bfe97059e4e7d5f4f86487cc262662855eb2bbd6940fc8'
          pathlib.Path('surfpatch.py').write_bytes(script)
          with zipfile.ZipFile('base/PandaTV-TEST.apk') as z:
              for name in ('classes4.dex','assets/panda_program_details_v172.js','assets/pandatv_v2943_native_catalog.js'):
                  path=pathlib.Path('patchwork')/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(z.read(name))
          PY
          baksmali d -l patchwork/classes4.dex -o patchwork/smali
          python3 surfpatch.py patchwork/smali/com/pandatv/iptv/NativePlayerActivity.smali patchwork/assets/panda_program_details_v172.js patchwork/assets/pandatv_v2943_native_catalog.js
          smali a patchwork/smali -o patchwork/classes4.dex
          node --check patchwork/assets/panda_program_details_v172.js
          node --check patchwork/assets/pandatv_v2943_native_catalog.js
      - name: Repackage exactly 3 edited entries and separate QA package identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo
          from hashlib import sha256
          edits=('classes4.dex','assets/panda_program_details_v172.js','assets/pandatv_v2943_native_catalog.js')
          old='com.pandatv.elitev301.elite191'.encode('utf-16le')
          new='com.pandatv.elitev301.elite192'.encode('utf-16le')
          assert len(old)==len(new)
          with ZipFile('base/PandaTV-TEST.apk') as inp,ZipFile('PandaTV-raw.apk','w') as out:
              for path in inp.namelist():
                  if path.startswith('META-INF/') and path.endswith(('.RSA','.SF')):continue
                  if path=='META-INF/MANIFEST.MF':continue
                  info=inp.getinfo(path)
                  data=(Path('patchwork')/path).read_bytes() if path in edits else inp.read(path)
                  if path=='AndroidManifest.xml':
                      assert data.count(old)>0
                      data=data.replace(old,new)
                  zi=ZipInfo(path,info.date_time)
                  zi.compress_type=info.compress_type
                  zi.external_attr=info.external_attr
                  zi.internal_attr=info.internal_attr
                  zi.create_system=info.create_system
                  zi.comment=info.comment
                  out.writestr(zi,data,compress_type=zi.compress_type,compresslevel=6)
          with ZipFile('base/PandaTV-TEST.apk') as oldzip,ZipFile('PandaTV-raw.apk') as newzip:
              assert newzip.testzip() is None
              preserved=[n for n in oldzip.namelist() if (n.endswith('.dex') or n.endswith('.so')) and n!='classes4.dex']
              assert len(preserved)==14,len(preserved)
              for name in preserved:
                  assert sha256(oldzip.read(name)).digest()==sha256(newzip.read(name)).digest(),name
          print('All ten native FFmpeg libraries and four other DEX files identical to working baseline')
          PY
      - name: Sign independent test APK and verify
        run: |
          set -euo pipefail
          BT="$(find /usr/local/lib/android/sdk/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 PandaTV-raw.apk PandaTV-aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -alias eliteqa -keyalg RSA -keysize 3072 -validity 365 -keystore "$RUNNER_TEMP/panda192.jks" -storepass "$PASS" -keypass "$PASS" -dname 'CN=Panda Tv Elite QA' >/dev/null 2>&1
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/panda192.jks" --ks-key-alias eliteqa --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out PandaTV-TEST.apk PandaTV-aligned.apk
          "$BT/apksigner" verify --verbose PandaTV-TEST.apk
          "$BT/zipalign" -c -v 4 PandaTV-TEST.apk > alignment.txt
          "$BT/aapt" dump badging PandaTV-TEST.apk | tee badging.txt | head -n 12
          grep -q "^package: name='com.pandatv.elitev301.elite192'" badging.txt
          grep -q "^application-label:'Panda Tv Elite'" badging.txt
          sha256sum PandaTV-TEST.apk > sha256.txt
      - name: Publish separate prerelease, never replace approved live version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.9.2-elite-surf-title-qa.1
          cat > notes.md <<'NOTES'
          # Panda Tv Elite 1.9.2 Channel Surfing Title QA
          Owner-confirmed working 1.9.1 build with one focused fix: CH +/- and left/right now request the correct channel title and EPG information after surfing.
          Native decoder libraries, playback URLs, streaming configuration, and recovery remain unchanged.
          **Separate test installation (com.pandatv.elitev301.elite192).** Not an in-place update. Keep your working PandaTV installed.
          This is an experimental prerelease; real-device IPTV still needs confirmation before replacing the official download.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" PandaTV-TEST.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Panda Tv Elite 1.9.2 — Surfing Title QA' --notes-file notes.md --prerelease
          else
            gh release create "$TAG" PandaTV-TEST.apk --repo "$GITHUB_REPOSITORY" --target main --title 'Panda Tv Elite 1.9.2 — Surfing Title QA' --notes-file notes.md --prerelease
          fi
